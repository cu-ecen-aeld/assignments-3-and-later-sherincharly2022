name: assignment-test

on:
    push:
        tags-ignore:
            - '*'
        branches:
            - 'assignment7-part1'

jobs:
    unit-test:
        container: cuaesd/aesd-autotest:24-unit-test
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v2

          - name: Checkout submodules
            run: git submodule update --init --recursive

          - name: Upload Root CA Certificate
            uses: actions/upload-artifact@v4
            with:
              name: ZscalerRootCA
              path: ~/ZscalerRootCA.crt

          - name: Download Root CA Certificate
            uses: actions/download-artifact@v4
            with:
              name: ZscalerRootCA
              path: ./certs

          - name: Add Root CA Certificate
            run: |
              sudo cp ./certs/ZscalerRootCA.crt /usr/local/share/ca-certificates/
              sudo update-ca-certificates

          - name: Verify Certificate Installation
            run: |
              ls -l /etc/ssl/certs | grep "ZscalerRootCA"

          - name: Run unit test
            run: ./unit-test.sh

    full-test:
        container: cuaesd/aesd-autotest:24-assignment7
        runs-on: self-hosted
        steps:
          - uses: actions/checkout@v2

          - name: Checkout submodules
            run: git submodule update --init --recursive

          - name: Upload Root CA Certificate
            uses: actions/upload-artifact@v4
            with:
              name: ZscalerRootCA
              path: ~/ZscalerRootCA.crt

          - name: Download Root CA Certificate
            uses: actions/download-artifact@v4
            with:
              name: ZscalerRootCA
              path: ./certs

          - name: Add Root CA Certificate
            run: |
              sudo cp ./certs/ZscalerRootCA.crt /usr/local/share/ca-certificates/
              sudo update-ca-certificates

          - name: Verify Certificate Installation
            run: |
              ls -l /etc/ssl/certs | grep "ZscalerRootCA"

          - name: Run full test
            run: ./full-test.sh
